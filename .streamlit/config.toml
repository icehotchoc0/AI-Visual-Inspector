# 마이스터즈 브랜드 토큰 (로고: 검정 #191A1A · 레드 #C4191F · 옐로 #F3CB0E)
[theme]
primaryColor = "#C4191F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#191A1A"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# 시연 화면에서 Streamlit 기본 메뉴(Deploy 등)를 숨김
toolbarMode = "minimal"

[server]
maxUploadSize = 50
