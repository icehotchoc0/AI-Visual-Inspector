name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate category config
        run: python -c "from backend.categories import CategoryRegistry; r = CategoryRegistry.from_path('config/categories'); print(len(r.ids), 'categories OK')"
      - name: Unit + API tests (offline, fake VLM)
        run: pytest tests/ -q --maxfail=1
      - name: Smoke-boot the API
        run: |
          INSPECTOR_API_KEYS=ci INSPECTOR_VLM_PROVIDERS=claude INSPECTOR_QUEUE_WORKERS=0 INSPECTOR_DB_PATH=/tmp/ci.db \
            timeout 40 bash -c 'uvicorn backend.app:app --port 8765 & sleep 6; curl -fsS http://127.0.0.1:8765/health | grep -q \"\\\"status\\\":\\\"ok\\\"\" && echo boot-ok'
