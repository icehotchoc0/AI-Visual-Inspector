# ---------------------------------------------------------------------------
# 당장 취급하지 않는 카테고리 보관 파일 (로드되지 않음)
#
# 서비스에 다시 추가하려면 아래 항목을 config/categories.yaml 의 categories:
# 아래로 옮기기만 하면 됩니다. 필드 설명은 categories.yaml 상단 주석 참고.
# ---------------------------------------------------------------------------

categories:
  - id: window_install
    name: 창호 시공
    group: housing
    description: >
      창호(샷시) 교체 및 설치. 기존 창 철거, 프레임 고정, 유리 끼움, 실리콘 마감, 개폐 확인 포함.
    shots:
      - {id: site_before, name: 시공 전 현장, description: 기존 창호 또는 철거된 개구부의 시공 전 사진, required: true, phase: before}
      - {id: frame_fixed, name: 프레임 고정, description: 고정된 창틀과 앵커/폼 충진이 보이는 사진, required: false, phase: after}
      - {id: window_closed, name: 설치 완료(닫힘), description: 창이 닫힌 상태의 실내측 정면 전체 사진, required: true, phase: after}
      - {id: sealing_detail, name: 실리콘 마감, description: 창틀과 벽 사이 실리콘 마감선이 보이는 클로즈업 사진, required: true, phase: after}
      - {id: exterior_view, name: 외부측 확인, description: 실외측에서 본 창호·마감 사진, required: false, phase: after}
    before_after_pairs:
      - [site_before, window_closed]
    defect_rubric:
      - {code: glass_crack, name: 유리 파손/균열, description: 유리에 금이 갔거나 깨짐·흠집이 있음, default_severity: high}
      - {code: sealing_gap, name: 실리콘 마감 불량, description: 실리콘이 끊기거나 틈이 있거나 두께가 불균일함, default_severity: medium}
      - {code: frame_misaligned, name: 창틀 기울어짐, description: 창틀이 수직/수평이 맞지 않아 틈이 비대칭, default_severity: high}
      - {code: foam_exposed, name: 폼 노출, description: 우레탄 폼이 잘리지 않고 노출되어 있거나 마감되지 않음, default_severity: medium}
      - {code: surface_damage, name: 표면 손상, description: 프레임·유리의 긁힘·찍힘·보호필름 미제거, default_severity: low}
      - {code: wall_damage, name: 벽면 손상, description: 시공 중 생긴 벽면·마감재 손상, default_severity: medium}
      - {code: debris_left, name: 잔재물/청소 미흡, description: 철거 잔해·절단 자재·포장재 방치, default_severity: low}
