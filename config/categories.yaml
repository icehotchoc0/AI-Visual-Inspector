# ---------------------------------------------------------------------------
# 검사 카테고리 정의 (AI-Visual-Inspector / 현장 AS·설치 사진 검증)
#
# 카테고리는 코드가 아니라 이 파일로 정의합니다. 새 작업 종류가 생기면 항목을
# 추가하기만 하면 API(/v1/categories)와 파이프라인이 그대로 인식합니다.
#
# 각 카테고리 필드:
#   id              : API에서 쓰는 식별자 (영문 소문자/언더스코어)
#   name            : 화면 표시용 한국어 이름
#   group           : appliance (가전) | housing (주거 시설 시공) | commercial (업무·교육 시설)
#   description     : VLM 프롬프트에 그대로 들어가는 작업 설명 (한국어)
#   shots           : 이 작업에서 등장할 수 있는 사진 컷 목록
#       id          : 컷 식별자. 기사 앱이 declared_shot_type 으로 보내는 값
#       name        : 한국어 이름
#       description : VLM이 컷을 분류할 때 참고하는 설명
#       required    : true 면 체크리스트 필수 컷 (누락 시 finding)
#       phase       : before | after | any  (이 컷이 속하는 작업 단계)
#   before_after_pairs : 전/후 비교가 필요한 컷 쌍 (before 컷 id, after 컷 id)
#   defect_rubric   : VLM이 찾아야 할 시각적 하자 코드 목록
#       code        : finding 코드 (machine-readable)
#       name        : 한국어 이름
#       description : 무엇을 보고 판단하는지 (VLM 프롬프트에 포함)
#       default_severity : low | medium | high  (VLM이 심각도를 주지 못할 때 기본값)
#   quality         : 사진 품질 임계값 오버라이드 (선택)
#   anomaly         : 고정 구도 컷에만 쓰는 선택적 이상 탐지(Anomalib) 플러그인
#       enabled     : true 면 shot_types 에 해당하는 컷에 PatchCore/EfficientAd 추가 실행
#       model_key   : backend/data/checkpoints/<model_key>/<backend>/model.ckpt
#       shot_types  : 이상 탐지를 적용할 컷 id 목록
# ---------------------------------------------------------------------------

defaults:
  quality:
    min_width: 640
    min_height: 480
    blur_threshold: 60.0        # Laplacian variance. 이 값 미만이면 흐림
    dark_threshold: 45.0        # 평균 밝기(0~255). 이 값 미만이면 어두움
    bright_threshold: 225.0     # 평균 밝기. 이 값 초과이면 과노출
    low_contrast_threshold: 18.0  # 밝기 표준편차. 이 값 미만이면 저대비
  fraud:
    duplicate_hamming_max: 6    # 64bit dHash 해밍 거리. 이하이면 동일/재사용 사진
    near_duplicate_hamming_max: 12  # 이하이면 유사 사진(REVIEW)
    gps_max_spread_km: 0.5      # 한 작업 내 사진 GPS 간 거리. 초과 시 다른 현장 의심
  verdict:
    min_defect_confidence: 0.6  # 이 미만의 VLM 하자 finding 은 참고용으로만 기록
    missing_required_shot: fail  # fail | review

categories:
  # ========================= 가전 (appliance) =========================
  - id: aircon_install
    name: 에어컨 설치
    group: appliance
    description: >
      가정용 벽걸이/스탠드 에어컨 신규 설치. 실내기 거치, 배관(냉매관·드레인) 연결,
      실외기 설치(앵글/거치대), 배관 마감(테이핑/보온), 전원 연결, 시운전까지 포함.
    shots:
      - {id: indoor_unit_before, name: 설치 전 실내 위치, description: 실내기를 설치할 벽면/위치가 보이는 사진(설치 전), required: true, phase: before}
      - {id: indoor_unit_after, name: 실내기 설치 완료, description: 벽에 거치된 실내기 전체가 정면 또는 약간 측면에서 보이는 사진, required: true, phase: after}
      - {id: outdoor_unit_after, name: 실외기 설치 완료, description: 실외기와 거치대(앵글)·고정 볼트가 보이는 사진, required: true, phase: after}
      - {id: pipe_finish, name: 배관 마감, description: 냉매 배관과 드레인 호스의 보온재·테이핑·벽 관통부 마감이 보이는 사진, required: true, phase: after}
      - {id: drain_test, name: 드레인 배수 확인, description: 드레인 호스 끝에서 물이 배출되는 모습 또는 배수 테스트 사진, required: false, phase: after}
      - {id: power_connection, name: 전원 연결, description: 전원 플러그/차단기/전선 연결부 사진, required: false, phase: after}
      - {id: remote_test, name: 시운전, description: 전원이 켜진 실내기 디스플레이 또는 리모컨 설정 온도가 보이는 사진, required: false, phase: after}
    before_after_pairs:
      - [indoor_unit_before, indoor_unit_after]
    defect_rubric:
      - {code: exposed_wiring, name: 전선 노출, description: 피복이 벗겨졌거나 결선부가 마감 없이 노출된 전선, default_severity: high}
      - {code: pipe_insulation_missing, name: 배관 보온재 누락, description: 냉매 배관이 보온재 없이 맨 동관으로 노출됨 또는 보온재가 찢어져 틈이 있음, default_severity: medium}
      - {code: wall_damage, name: 벽면 손상, description: 벽지 찢김·타공 주변 균열·시멘트 파손 등 설치로 생긴 벽면 손상, default_severity: medium}
      - {code: unit_tilted, name: 실내기/실외기 기울어짐, description: 수평이 맞지 않아 눈에 띄게 기울어진 실내기 또는 실외기, default_severity: medium}
      - {code: bracket_unsecured, name: 거치대 고정 불량, description: 실외기 앵글 볼트 누락·헐거움·녹슨 거치대, default_severity: high}
      - {code: drain_leak, name: 누수/물 고임, description: 드레인 연결부·실내기 아래 물방울·물자국·물 고임, default_severity: high}
      - {code: sealing_gap, name: 관통부 마감 불량, description: 벽 관통 구멍 주변에 실리콘/퍼티 마감이 없거나 틈이 보임, default_severity: medium}
      - {code: debris_left, name: 잔재물/청소 미흡, description: 작업 후 남겨진 포장재·절단 배관 조각·먼지·공구, default_severity: low}

  - id: washer_repair
    name: 세탁기 수리
    group: appliance
    description: >
      드럼/통돌이 세탁기 출장 수리. 고장 부위 확인, 부품 교체(모터·배수펌프·호스·보드 등),
      조립 후 동작 확인.
    shots:
      - {id: fault_before, name: 고장 부위(수리 전), description: 교체·수리할 부품 또는 고장 증상(누수·파손 등)이 보이는 수리 전 사진, required: true, phase: before}
      - {id: replaced_part, name: 교체 부품, description: 새 부품과 탈거한 구 부품이 함께 보이거나 장착된 새 부품이 보이는 사진, required: true, phase: after}
      - {id: assembled_after, name: 조립 완료, description: 외관 패널이 모두 닫히고 조립이 완료된 세탁기 전체 사진, required: true, phase: after}
      - {id: operation_test, name: 동작 확인, description: 전원이 켜져 디스플레이에 동작 상태가 표시되는 사진, required: false, phase: after}
      - {id: model_label, name: 모델 라벨, description: 세탁기 모델명·시리얼 번호 스티커가 보이는 사진, required: false, phase: any}
    before_after_pairs:
      - [fault_before, assembled_after]
    defect_rubric:
      - {code: exposed_wiring, name: 전선 노출, description: 마감되지 않은 전선·커넥터 노출, default_severity: high}
      - {code: panel_gap, name: 패널 조립 불량, description: 외관 패널·상판·도어가 완전히 닫히지 않아 틈이 벌어진 상태, default_severity: medium}
      - {code: hose_loose, name: 호스 체결 불량, description: 급수·배수 호스가 느슨하거나 클램프가 누락됨, default_severity: high}
      - {code: water_leak, name: 누수 흔적, description: 바닥·본체 하부의 물 고임이나 물자국, default_severity: high}
      - {code: scratch_dent, name: 외관 손상, description: 수리 과정에서 생긴 긁힘·찍힘·패널 변형, default_severity: low}
      - {code: debris_left, name: 잔재물/청소 미흡, description: 작업 후 남겨진 구 부품·포장재·공구, default_severity: low}

  - id: fridge_repair
    name: 냉장고 수리
    group: appliance
    description: >
      냉장고 출장 수리. 냉각 불량·소음·누수·도어 문제 등 고장 부위 확인, 부품 교체, 조립 후 동작 확인.
    shots:
      - {id: fault_before, name: 고장 부위(수리 전), description: 고장 증상 또는 교체할 부품이 보이는 수리 전 사진, required: true, phase: before}
      - {id: replaced_part, name: 교체 부품, description: 장착된 새 부품 또는 신·구 부품 비교 사진, required: true, phase: after}
      - {id: assembled_after, name: 조립 완료, description: 커버·패널이 닫힌 수리 완료 상태 전체 사진, required: true, phase: after}
      - {id: operation_test, name: 동작 확인, description: 디스플레이 온도 표시 또는 작동 상태가 보이는 사진, required: false, phase: after}
      - {id: model_label, name: 모델 라벨, description: 모델명·시리얼 번호 라벨 사진, required: false, phase: any}
    before_after_pairs:
      - [fault_before, assembled_after]
    defect_rubric:
      - {code: exposed_wiring, name: 전선 노출, description: 마감되지 않은 전선·커넥터 노출, default_severity: high}
      - {code: panel_gap, name: 커버/패널 조립 불량, description: 후면 커버·내부 패널이 완전히 체결되지 않음, default_severity: medium}
      - {code: water_leak, name: 누수/결빙 흔적, description: 바닥 물 고임·내부 과도한 결빙·물자국, default_severity: medium}
      - {code: door_misaligned, name: 도어 단차, description: 도어 높이가 맞지 않거나 밀착되지 않음, default_severity: medium}
      - {code: scratch_dent, name: 외관 손상, description: 긁힘·찍힘·패널 변형, default_severity: low}
      - {code: debris_left, name: 잔재물/청소 미흡, description: 구 부품·포장재·공구 방치, default_severity: low}

  # ========================= 주거 시설 시공 (housing) =========================
  - id: plumbing
    name: 배관 시공
    group: housing
    description: >
      주거 공간 급수·배수 배관 시공 및 수리. 배관 교체, 밸브·수전 연결, 누수 보수, 마감까지 포함.
    shots:
      - {id: site_before, name: 시공 전 현장, description: 시공할 배관 구간 또는 누수 부위가 보이는 시공 전 사진, required: true, phase: before}
      - {id: pipe_connection, name: 배관 연결부, description: 새로 연결된 이음부·밸브·피팅이 선명하게 보이는 사진, required: true, phase: after}
      - {id: leak_test, name: 누수 테스트, description: 물을 흘려보낸 상태에서 이음부 주변이 건조한 것을 보여주는 사진, required: true, phase: after}
      - {id: site_after, name: 시공 후 현장, description: 마감이 완료된 시공 구간 전체 사진, required: true, phase: after}
      - {id: material_label, name: 자재 확인, description: 사용 자재(배관·밸브) 규격 라벨 사진, required: false, phase: any}
    before_after_pairs:
      - [site_before, site_after]
    defect_rubric:
      - {code: leak_visible, name: 누수, description: 이음부·배관 표면의 물방울·물자국·젖은 흔적, default_severity: high}
      - {code: joint_misaligned, name: 이음부 불량, description: 피팅이 비스듬히 체결되었거나 완전히 삽입되지 않음·테프론/실란트 과다 노출, default_severity: high}
      - {code: pipe_unsupported, name: 배관 지지 불량, description: 긴 구간의 배관이 클램프/행거 없이 늘어져 있음, default_severity: medium}
      - {code: corrosion, name: 부식/녹, description: 재사용된 부품·주변 배관의 심한 녹이나 부식, default_severity: medium}
      - {code: wall_damage, name: 벽/바닥 손상, description: 시공 중 생긴 타일 파손·벽면 균열·마감재 손상, default_severity: medium}
      - {code: sealing_gap, name: 마감 불량, description: 관통부·수전 주변 실리콘 마감 누락 또는 틈, default_severity: medium}
      - {code: debris_left, name: 잔재물/청소 미흡, description: 절단 배관·포장재·먼지 방치, default_severity: low}

  - id: electrical
    name: 전기 시공
    group: housing
    description: >
      주거 공간 전기 시공. 콘센트·스위치·조명 교체, 배선, 분전반 작업, 마감 포함.
    shots:
      - {id: site_before, name: 시공 전 현장, description: 교체·시공할 전기 설비(콘센트·스위치·조명·분전반)의 시공 전 사진, required: true, phase: before}
      - {id: wiring_detail, name: 결선 상세, description: 커버를 닫기 전 결선 상태(단자·접속부)가 선명하게 보이는 사진, required: true, phase: after}
      - {id: finished_fixture, name: 마감 완료, description: 커버·플레이트가 닫히고 마감된 설비 사진, required: true, phase: after}
      - {id: power_test, name: 통전 확인, description: 조명 점등 또는 테스터기 측정값이 보이는 사진, required: false, phase: after}
      - {id: breaker_panel, name: 분전반, description: 작업 관련 차단기와 라벨이 보이는 분전반 사진, required: false, phase: any}
    before_after_pairs:
      - [site_before, finished_fixture]
    defect_rubric:
      - {code: exposed_wiring, name: 전선 노출, description: 마감 후에도 피복이 벗겨진 전선이나 결선부가 외부로 노출됨, default_severity: high}
      - {code: loose_terminal, name: 단자 체결 불량, description: 단자에 전선이 헐겁게 물려 있거나 심선이 과도하게 노출됨, default_severity: high}
      - {code: scorch_mark, name: 탄 흔적/변색, description: 단자·콘센트·전선 주변의 그을음이나 열 변색, default_severity: high}
      - {code: plate_misaligned, name: 플레이트 마감 불량, description: 스위치/콘센트 플레이트가 기울었거나 벽과 틈이 벌어짐, default_severity: low}
      - {code: wall_damage, name: 벽면 손상, description: 시공 중 생긴 벽지 찢김·석고 파손, default_severity: medium}
      - {code: debris_left, name: 잔재물/청소 미흡, description: 전선 조각·포장재·공구 방치, default_severity: low}

  - id: door_install
    name: 도어 설치
    group: housing
    description: >
      실내문·현관문·중문 설치 및 교체. 문틀 시공, 문짝 거치, 힌지·손잡이·잠금장치 설치, 마감 포함.
    shots:
      - {id: site_before, name: 시공 전 현장, description: 기존 문 또는 비어 있는 개구부의 시공 전 사진, required: true, phase: before}
      - {id: frame_install, name: 문틀 시공, description: 설치된 문틀과 고정부(앵커·폼)가 보이는 사진, required: false, phase: after}
      - {id: door_closed, name: 설치 완료(닫힘), description: 문이 닫힌 상태의 정면 전체 사진, required: true, phase: after}
      - {id: door_open, name: 설치 완료(열림), description: 문이 열린 상태로 힌지·문틀 측면이 보이는 사진, required: true, phase: after}
      - {id: hardware_detail, name: 하드웨어 상세, description: 손잡이·잠금장치·힌지 클로즈업 사진, required: false, phase: after}
    before_after_pairs:
      - [site_before, door_closed]
    defect_rubric:
      - {code: door_gap_uneven, name: 문틈 불균일, description: 문과 문틀 사이 틈이 위아래/좌우로 눈에 띄게 다름, default_severity: medium}
